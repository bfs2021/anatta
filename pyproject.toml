[project]
name = "anatta"
version = "0.2.0"
description = "An open harness for the AI Conditioning Protocol: map the ego in activation space, loosen it, recondition, and test whether the change is geometry or cosplay."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Eugene Jhong" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.46",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
evals = ["inspect-ai>=0.3.100"]
mirror = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
train = ["trl>=0.19", "peft>=0.13", "datasets>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
anatta = "anatta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anatta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.entry-points.inspect_ai]
anatta = "anatta.inspect_ext"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "E731"]
